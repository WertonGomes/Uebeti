<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <title>Unity Web Player | Uebeti</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      display: block;
      background: #000;
    }

    #unity-loading-bar,
    #unity-warning {
      position: absolute;
      width: 100%;
      z-index: 10;
    }

    /* Botão de tela cheia */
    #fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #fff;
      border-radius: 8px;
      padding: 10px 16px;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(4px);
    }

    #fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1170" height="2532" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full" style="width: 0%; height: 100%; background: white;"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <!-- Botão de fullscreen -->
  <div id="fullscreen-btn">Tela cheia</div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fullscreenBtn = document.querySelector("#fullscreen-btn");

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      const div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type === 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(() => {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Uebeti.loader.js";
    const config = {
      dataUrl: buildUrl + "/Uebeti.data",
      frameworkUrl: buildUrl + "/Uebeti.framework.js",
      codeUrl: buildUrl + "/Uebeti.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "WeirdProduction",
      productName: "Uebeti",
      productVersion: "0.1",
      showBanner: unityShowBanner,
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: false
    };

    function resizeCanvas() {
      const targetWidth = 1170;
      const targetHeight = 2532;
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const scale = Math.min(windowWidth / targetWidth, windowHeight / targetHeight);
      canvas.style.width = `${targetWidth * scale}px`;
      canvas.style.height = `${targetHeight * scale}px`;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("load", resizeCanvas);

    document.querySelector("#unity-loading-bar").style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";

        // Funcionalidade do botão de fullscreen
        fullscreenBtn.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
